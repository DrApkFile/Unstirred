      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* The site a judge can open today, in four cuts, then the one command the README puts
             in front of them. The URL bar is the thread through the montage: it is the real
             published address of the page in the frame, and the bytes are this repository's own
             build of that page. */
          var AT_REPLAY = 1.7;
          var AT_GUIDE = 2.8;
          var AT_API = 3.9;
          var AT_TERM = 4.9;

          var site = document.getElementById("s8-site");
          var replay = document.getElementById("s8-replay");
          var guide = document.getElementById("s8-guide");
          var api = document.getElementById("s8-api");
          var term = document.getElementById("s8-term");

          film.terminal(tl, term, 8);
          film.camera(tl, document.getElementById("s8-world-site"), []);
          film.camera(tl, document.getElementById("s8-world-replay"), []);
          film.camera(tl, document.getElementById("s8-world-guide"), []);
          film.camera(tl, document.getElementById("s8-world-api"), []);

          gsap.set([replay, guide, api, term], { opacity: 0 });

          /* Each cut is a short dissolve, so the frame of the browser never moves and only the
             page and its URL change. */
          function cutTo(element, at) {
            tl.fromTo(element, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
          }
          function cutFrom(element, at) {
            tl.to(element, { opacity: 0, duration: 0.25, ease: "power2.in" }, at);
          }

          /* The pointer goes to the landing page's own "Open the demo" link and clicks it; the
             cut to the act lands on that click. */
          film.pointer(tl, document.getElementById("s8-pointer"), [
            { at: 0.25, dur: 1.1, from: [1340, 820], to: [520, 640] },
            { at: AT_REPLAY - 0.25, click: true }
          ]);

          cutTo(replay, AT_REPLAY);
          cutFrom(site, AT_REPLAY);
          cutTo(guide, AT_GUIDE);
          cutFrom(replay, AT_GUIDE);
          cutTo(api, AT_API);
          cutFrom(guide, AT_API);
          cutFrom(api, AT_TERM - 0.25);
          tl.fromTo(term, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, AT_TERM);

          tl.fromTo(
            document.getElementById("s8-verdict"),
            { scale: 1.12, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
            7.3
          );

          window.__timelines["s8-tryit"] = tl;
        })();
      </script>
