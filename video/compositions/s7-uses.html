<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Where a door like this fits</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--paper);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: var(--gap-4);
          padding: 0 var(--term-x) 120px;
        }

        #s7-stamp {
          font-size: 28px;
        }

        #s7-title {
          font-size: 58px;
        }

        .uses-head {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-3);
        }

        .uses-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: var(--gap-3);
          width: 1740px;
        }

        .uses-grid .card {
          min-height: 430px;
          padding: var(--gap-5) var(--gap-4);
          display: flex;
          flex-direction: column;
          gap: var(--gap-2);
        }

        .uses-grid .card h3 {
          font-size: 30px;
        }

        .uses-grid .card p {
          font-size: 28px;
        }
      </style>

      <div data-hf-id="hf-cevs" id="root" data-composition-id="s7-uses" data-width="1920" data-height="1080">
        <div data-hf-id="hf-0v3z" class="uses-head">
          <span data-hf-id="hf-g7l2" class="stamp" id="s7-stamp">uses · illustrative, not measured</span>
          <span data-hf-id="hf-qdw3" class="hero" id="s7-title">Where a door like this fits</span>
        </div>
        <div data-hf-id="hf-5sq9" class="uses-grid">
          <div data-hf-id="hf-vn2y" class="card">
            <h3 data-hf-id="hf-79vn">Holder-only communities and allowlists</h3>
            <p data-hf-id="hf-yp4b">Entry for people who've held, without KYC.</p>
          </div>
          <div data-hf-id="hf-i08u" class="card">
            <h3 data-hf-id="hf-79cq">Airdrops and faucets</h3>
            <p data-hf-id="hf-fx6g">One claim per coins held since a date.</p>
          </div>
          <div data-hf-id="hf-iejv" class="card">
            <h3 data-hf-id="hf-x0fy">Polls and feedback</h3>
            <p data-hf-id="hf-q74w">Answers only from long-held stake, all anonymous.</p>
          </div>
          <div data-hf-id="hf-isuw" class="card">
            <h3 data-hf-id="hf-zjfi">Private markets</h3>
            <p data-hf-id="hf-v8we">Only funded, patient participants post. Nobody is named.</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          gsap.set(document.getElementById("s7-stamp"), { opacity: 1, y: 0 });
          tl.fromTo(
            document.getElementById("s7-title"),
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.15
          );

          /* Four cards as one beat: the whole arrival is inside half a second. */
          tl.fromTo(
            ".uses-grid .card",
            { opacity: 0, y: 40, scale: 0.96 },
            {
              opacity: 1,
              y: 0,
              scale: 1,
              duration: 0.5,
              ease: "back.out(1.6)",
              stagger: 0.11
            },
            0.6
          );

          window.__timelines["s7-uses"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
