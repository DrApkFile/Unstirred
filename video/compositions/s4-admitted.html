<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alice is admitted</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--paper);
        }

        #s4-term {
          top: 197px;
          height: 606px;
        }

        #s4-browser {
          top: 8px;
          height: 986px;
        }

      </style>

      <div id="root" data-composition-id="s4-admitted" data-width="1920" data-height="1080">
        <div class="window" id="s4-term">
          <div class="window-bar">
            <div class="window-lamps"><i></i><i></i><i></i></div>
            <div class="window-name" data-layout-ignore>the holder's terminal</div>
            <div class="window-prov" data-layout-ignore>re-enactment of a recorded testnet run · evidence/2026-10-20-two-room-knock.txt</div>
          </div>
          <div class="term-body" data-layout-ignore>
            <!-- prettier-ignore-start -->
            <span class="line line-cmd" data-at="0" data-type="1.5" data-cursor="1">$ $U knock --gate http://127.0.0.1:8080 --room holders-room --wallet "$W" \</span>
            <span class="line line-cmd" data-at="1.6" data-type="1.3" data-cursor="1">    --pir http://localhost:3000 --lightwalletd https://testnet.zec.rocks:443 \</span>
            <span class="line line-cmd" data-at="3.0" data-type="0.9" data-cursor="1">    --identity "$ID" --expected-h1-root "$H1"</span>
            <span class="line line-key" data-at="3.95">gate          http://127.0.0.1:8080</span>
            <span class="line line-key" data-at="4.1">room          holders-room</span>
            <span class="line line-key" data-at="4.2">network       test</span>
            <span class="line line-key" data-at="4.3">window        h0 4505790 through h1 4506510</span>
            <span class="line line-key" data-at="4.4">threshold     12500000 zatoshis</span>
            <span class="line line-key" data-at="4.6">challenge     issued by the gate, expires 2026-10-20T14:41:14Z</span>
            <span class="line" data-at="5.0">proving now; this takes seconds and reveals nothing to the gate but the package</span>
            <span class="line line-cut" data-at="6.1">                                                               — cut —</span>
            <span class="line line-admit" data-at="7.2" id="s4-verdict">ADMITTED</span>
            <span class="line" data-at="8.1">the gate was sent one package proving 1 note(s) held unmoved across the window, and nothing else</span>
            <span class="line" data-at="8.5">wallet …/wallet/data.sqlite was opened read-only; no transaction was created</span>
            <span class="line" data-at="9.0" data-cursor="1">$ </span>
            <!-- prettier-ignore-end -->
            <span class="cursor-block"></span>
          </div>
        </div>

        <div class="browser" id="s4-browser">
          <div class="window-bar">
            <div class="window-lamps"><i></i><i></i><i></i></div>
            <div class="url" data-layout-ignore>127.0.0.1:8080/room/holders-room?replay=act2-admitted&amp;present=1</div>
            <div class="window-prov" data-layout-ignore>re-enactment of a recorded testnet run · evidence/2026-10-20-two-room-knock.txt</div>
          </div>
          <div class="viewport">
            <div class="viewport-world" id="s4-world">
              <iframe class="page-frame" src="assets/site/act2-admitted.present.html" title="Holders' Room, act 2"></iframe>
            </div>
            <div class="spotlight" id="s4-spot"></div>
            <div class="pointer" id="s4-pointer">
              <svg viewBox="0 0 26 26" aria-hidden="true">
                <path
                  d="M3 2 L3 20 L8 15.5 L11.2 23 L14.8 21.4 L11.7 14.2 L18.5 13.8 Z"
                  fill="#edeff3"
                  stroke="#0d0f13"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                />
              </svg>
              <div class="ripple"></div>
            </div>
          </div>
        </div>

      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var CUT = 9.5;

          film.terminal(tl, document.getElementById("s4-term"), CUT);
          film.camera(tl, document.getElementById("s4-world"), []);

          var term = document.getElementById("s4-term");
          var browser = document.getElementById("s4-browser");

          gsap.set(browser, { opacity: 0 });

          /* The verdict is the beat of the terminal half: it lands a shade over size and settles. */
          tl.fromTo(
            document.getElementById("s4-verdict"),
            { scale: 1.12, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
            7.2
          );

          tl.to(term, { opacity: 0, duration: 0.35, ease: "power2.in" }, CUT - 0.35);
          tl.fromTo(
            browser,
            { opacity: 0, scale: 0.985 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
            CUT
          );

          film.pointer(tl, document.getElementById("s4-pointer"), [
            { at: CUT + 0.35, dur: 1.5, from: [1330, 800], to: [1328, 281] },
            { at: CUT + 2.4, dur: 1.2, from: [1328, 281], to: [1270, 330], ease: "power1.inOut" }
          ]);

          /* What the door never saw is the point of the act, so everything else dims around it. */
          film.spotlight(tl, document.getElementById("s4-spot"), [1565, 240, 330, 245], CUT + 2.3, 0.55);

          window.__timelines["s4-admitted"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
