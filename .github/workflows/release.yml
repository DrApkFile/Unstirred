name: release

# Builds the binaries for a tag that already exists and attaches them to its release. It creates
# no tag and publishes nothing to crates.io: both of those are deliberate acts, done by hand from
# the tagged commit (HANDOFF.md, "the release").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing v* tag to build and attach to"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Add the target this job builds for
        run: rustup target add ${{ matrix.target }}

      - name: Refuse a Cargo.lock the build would change
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build the binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin unstirred

      - name: Package it with its checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="unstirred-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/examples" "dist/${name}/evidence"
          cp "target/${{ matrix.target }}/release/unstirred" "dist/${name}/"
          cp README.md SPEC.md CLAIMS.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          # The two files README's 60-second path names. Without them a stranger who downloaded
          # the binary has the commands and neither of their arguments.
          cp examples/holders-room.json "dist/${name}/examples/"
          cp evidence/2026-10-17-first-proof.json "dist/${name}/evidence/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          cat "${name}.tar.gz.sha256"

      - name: Show what this binary says it is
        run: ./target/${{ matrix.target }}/release/unstirred --version || true

      - name: Attach the tarball and its checksum to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
