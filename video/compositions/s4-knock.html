      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* Three of the 2:00 cut's scenes in one 22 s shot. Every recorded line is kept; what
             goes is hold time after the last line has landed, and the second knock's repeat of
             the room's own rule, which the first knock already read out in full. */
          var CUT_A = 8.4;   /* the admitted page */
          var CUT_TERM_B = 12.4;
          var CUT_B = 16.4;  /* the refused page */
          var CUT_C = 18.8;  /* the second room */

          var termA = document.getElementById("s4-term-a");
          var termB = document.getElementById("s4-term-b");
          var browserA = document.getElementById("s4-browser-a");
          var browserB = document.getElementById("s4-browser-b");
          var browserC = document.getElementById("s4-browser-c");

          film.terminal(tl, termA, CUT_A);
          film.terminal(tl, termB, CUT_B);
          film.camera(tl, document.getElementById("s4-world-a"), []);
          film.camera(tl, document.getElementById("s4-world-b"), []);
          film.camera(tl, document.getElementById("s4-world-c"), []);

          gsap.set([browserA, termB, browserB, browserC], { opacity: 0 });

          /* Each verdict is the beat of its half: it lands a shade over size and settles. */
          function verdict(element, at) {
            tl.fromTo(
              element,
              { scale: 1.12, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
              at
            );
          }
          verdict(document.getElementById("s4-verdict-a"), 5.45);
          verdict(document.getElementById("s4-verdict-b"), 15.3);

          /* ---- the admitted page ---- */
          tl.to(termA, { opacity: 0, duration: 0.35, ease: "power2.in" }, CUT_A - 0.35);
          tl.fromTo(
            browserA,
            { opacity: 0, scale: 0.985 },
            { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
            CUT_A
          );
          film.pointer(tl, document.getElementById("s4-pointer-a"), [
            { at: CUT_A + 0.3, dur: 1.2, from: [1330, 800], to: [1328, 281] }
          ]);
          /* What the door never saw is the point of the act, so everything else dims around it. */
          film.spotlight(tl, document.getElementById("s4-spot-a"), [1565, 240, 330, 245], 9.9, 0.5);

          /* ---- the same coins again ---- */
          tl.to(browserA, { opacity: 0, duration: 0.3, ease: "power2.in" }, CUT_TERM_B - 0.3);
          tl.fromTo(termB, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, CUT_TERM_B);

          /* ---- the refused page: the log the refusal did not touch ---- */
          tl.to(termB, { opacity: 0, duration: 0.3, ease: "power2.in" }, CUT_B - 0.3);
          tl.fromTo(
            browserB,
            { opacity: 0, scale: 0.985 },
            { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
            CUT_B
          );
          film.spotlight(tl, document.getElementById("s4-spot-b"), [1285, 250, 290, 270], CUT_B + 0.5, 0.45);

          /* ---- a second door, the same coins ---- */
          tl.to(browserB, { opacity: 0, duration: 0.3, ease: "power2.in" }, CUT_C - 0.3);
          tl.fromTo(
            browserC,
            { opacity: 0, scale: 0.985 },
            { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
            CUT_C
          );
          film.pointer(tl, document.getElementById("s4-pointer-c"), [
            { at: CUT_C + 0.3, dur: 1.1, from: [1340, 800], to: [703, 699] }
          ]);
          /* Two marker sets and the page's own line counting what they share. */
          film.spotlight(tl, document.getElementById("s4-spot-c"), [660, 640, 700, 290], CUT_C + 1.6, 0.5);

          window.__timelines["s4-knock"] = tl;
        })();
      </script>
