<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Close</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--paper);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: var(--gap-4);
          padding: 0 var(--term-x) 100px;
        }

        /* The lockup already carries the name and the mark, so the close shows it rather than
           setting the word "unstirred" a second time. The wrapper crops the PNG's own margin;
           its background is the design system's light --paper, the same surface the page uses. */
        .close-logo {
          width: 940px;
          height: 272px;
          overflow: hidden;
          border-radius: var(--radius-2);
        }

        .close-logo img {
          display: block;
          width: 940px;
          height: 470px;
          margin-top: -95px;
        }

        .close-line {
          display: block;
          font-size: 62px;
          line-height: 1.06;
          font-weight: 650;
          letter-spacing: -0.028em;
          color: var(--ink);
          text-align: center;
        }

        .close-line em {
          font-style: normal;
          color: var(--admit);
        }

        .close-facts {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--gap-2);
          font-size: 30px;
          line-height: var(--leading-body);
          color: var(--ink-dim);
          text-align: center;
        }

        .close-facts b {
          color: var(--ink);
          font-weight: 600;
        }

        .close-links {
          display: flex;
          align-items: center;
          gap: var(--gap-4);
          font-family: var(--mono);
          font-size: 30px;
          color: var(--accent);
        }
      </style>

      <div data-hf-id="hf-gjlu" id="root" data-composition-id="s9-close" data-width="1920" data-height="1080">
        <div data-hf-id="hf-4u3q" class="close-logo" id="s9-logo">
          <img data-hf-id="hf-ijcd" src="assets/icon.png" alt="unstirred" data-layout-allow-overflow />
        </div>
        <span data-hf-id="hf-pwwv" class="close-line" id="s9-line"
          >A private proof of how long you've <em data-hf-id="hf-m6co">held</em>.</span
        >
        <div data-hf-id="hf-j51a" class="close-facts">
          <span data-hf-id="hf-burd" class="close-fact"
            >Built on <b data-hf-id="hf-ioim">Valar Group's</b> audited delegation circuit, reused unchanged.</span
          >
          <span data-hf-id="hf-smwl" class="close-fact"
            >Zcash <b data-hf-id="hf-uf88">testnet</b>, Ironwood pool. Window h0 4,505,790 through h1 4,506,510.</span
          >
        </div>
        <div data-hf-id="hf-it4c" class="close-links">
          <span data-hf-id="hf-67hu" class="close-fact">github.com/DrApkFile/Unstirred</span>
          <span data-hf-id="hf-jxcs" class="close-fact">drapkfile.github.io/Unstirred</span>
          <span data-hf-id="hf-uyjk" class="close-fact">crates.io/crates/unstirred</span>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(
            document.getElementById("s9-logo"),
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.05
          );
          tl.fromTo(
            document.getElementById("s9-line"),
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.35
          );
          tl.fromTo(
            ".close-fact",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", stagger: 0.1 },
            1.3
          );

          window.__timelines["s9-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
