[package]
name = "unstirred-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Unstirred gate as an HTTP service: one room per manifest, challenge and admit routes that add no check of their own, and the Holders' Room page it serves itself."
readme = "README.md"
include = ["src/**/*", "ui/**/*", "README.md"]

[dependencies]
unstirred-core = { path = "../unstirred-core", version = "=0.1.0" }
unstirred-verifier = { path = "../unstirred-verifier", version = "=0.1.0" }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }
hyper-rustls.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
unstirred-prover = { path = "../unstirred-prover", version = "=0.1.0", features = ["test-harness"] }
voting-circuits.workspace = true
tempfile.workspace = true

[lints]
workspace = true
