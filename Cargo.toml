[workspace]
resolver = "2"
members = [
    "crates/unstirred-core",
    "crates/unstirred-prover",
    "crates/unstirred-verifier",
    "crates/unstirred-cli",
    "crates/unstirred-gate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DrApkFile/Unstirred"

[workspace.dependencies]
voting-circuits = { version = "=0.12.2", default-features = false, features = ["lrz"] }
voting-crypto-deps = { version = "=0.2.4", default-features = false, features = ["lrz"] }
pir-client = { version = "=0.7.4", default-features = false, features = ["upstream"] }
pir-types = { version = "=0.6.4", default-features = false }
blake2b_simd = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
hex = "=0.4.3"
thiserror = "=2.0.20"
zcash_client_sqlite = "=0.22.0"
zcash_client_backend = "=0.24.0"
zcash_protocol = "=0.10.5"
zcash_primitives = "=0.30.1"
rusqlite = { version = "=0.37.0", features = ["bundled", "array"] }
incrementalmerkletree = "=0.8.2"
tonic = { version = "=0.14.5", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "webpki-roots"] }
anyhow = "=1.0.104"
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
bip0039 = { version = "=0.14.0", default-features = false, features = ["std"] }
secrecy = "=0.8.0"
toml = "=0.8.23"
zip32 = "=0.2.1"
rand = "=0.8.8"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = false
