<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>How to install it</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--paper);
        }

        #s2-head {
          position: absolute;
          left: var(--term-x);
          top: 166px;
          font-size: 30px;
          font-weight: 600;
          color: var(--ink-dim);
        }

        #s2-term {
          top: 236px;
          height: 527px;
        }

        /* A plain separator between the two paths. It is not a `line-cut`, which this film uses
           only to mark a wait that was compressed out of a recorded run. */
        .line-sep {
          color: var(--ink-faint);
          font-size: 18px;
        }

        #s2-version {
          color: var(--admit);
        }

        /* v0.1.0 is tagged and the crates are published, so this line states what is there
           rather than warning that it is not. Both halves were checked the day of this cut. */
        #s2-note {
          position: absolute;
          left: var(--term-x);
          top: 790px;
          width: var(--term-w);
          font-family: var(--mono);
          font-size: 28px;
          line-height: var(--leading-body);
          color: var(--ink-dim);
        }

        #s2-note b {
          color: var(--admit);
          font-weight: 400;
        }
      </style>

      <div data-hf-id="hf-yr9s" id="root" data-composition-id="s2-install" data-width="1920" data-height="1080">
        <span data-hf-id="hf-wtja" id="s2-head">Step one: get the binary.</span>
        <div data-hf-id="hf-tlfw" class="window" id="s2-term">
          <div data-hf-id="hf-85t8" class="window-bar">
            <div data-hf-id="hf-03re" class="window-lamps"><i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i></div>
            <div data-hf-id="hf-kdxr" class="window-name" data-layout-ignore>a judge's terminal</div>
            <div data-hf-id="hf-i0uy" class="window-prov" data-layout-ignore>how to use it · README.md, .github/workflows/release.yml, crates.io/crates/unstirred · output: unstirred --version</div>
          </div>
          <div data-hf-id="hf-8752" class="term-body" data-layout-ignore>
            <!-- prettier-ignore-start -->
            <span data-hf-id="hf-j7dd" class="line line-cmd" data-at="0" data-type="0.5" data-cursor="1">$ R=https://github.com/DrApkFile/Unstirred/releases/download/v0.1.0</span>
            <span data-hf-id="hf-4zde" class="line line-cmd" data-at="0.6" data-type="0.4" data-cursor="1">$ T=unstirred-v0.1.0-x86_64-unknown-linux-gnu.tar.gz</span>
            <span data-hf-id="hf-0lqg" class="line line-cmd" data-at="1.1" data-type="0.9" data-cursor="1">$ curl -LO $R/$T  &amp;&amp;  curl -LO $R/$T.sha256</span>
            <span data-hf-id="hf-73ty" class="line line-cmd" data-at="2.2" data-type="0.7" data-cursor="1">$ sha256sum -c $T.sha256</span>
            <span data-hf-id="hf-nryb" class="line line-cmd" data-at="3.1" data-type="0.5" data-cursor="1">$ tar -xzf $T</span>
            <span data-hf-id="hf-5soa" class="line line-sep" data-at="3.9">                              — or from crates.io —</span>
            <span data-hf-id="hf-b6o3" class="line line-cmd" data-at="4.8" data-type="0.8" data-cursor="1">$ cargo install unstirred</span>
            <span data-hf-id="hf-udrx" class="line line-cut" data-at="5.9">                              — cut — a cold release build is not quick (README.md)</span>
            <span data-hf-id="hf-428h" class="line line-cmd" data-at="7.0" data-type="0.6" data-cursor="1">$ unstirred --version</span>
            <span data-hf-id="hf-eki3" class="line" data-at="8.0" id="s2-version">unstirred 0.1.0</span>
            <span data-hf-id="hf-nvc7" class="line" data-at="8.8" data-cursor="1">$ </span>
            <!-- prettier-ignore-end -->
            <span data-hf-id="hf-7o7f" class="cursor-block"></span>
          </div>
        </div>
        <span data-hf-id="hf-vuj2" id="s2-note"
          >v0.1.0 is tagged: <b data-hf-id="hf-ugaf">three platform tarballs, each with its .sha256</b> — and all five
          crates are on crates.io at 0.1.0.</span
        >
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          film.terminal(tl, document.getElementById("s2-term"), 10);

          tl.fromTo(
            document.getElementById("s2-head"),
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
            0
          );

          /* The version line is the only output in this scene, and it is the one thing the viewer
             can check for themselves in a second: it lands with the weight of a verdict. */
          tl.fromTo(
            document.getElementById("s2-version"),
            { scale: 1.1, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
            8.0
          );

          tl.fromTo(
            document.getElementById("s2-note"),
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
            2.2
          );

          window.__timelines["s2-install"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
