<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bob, the newcomer</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--paper);
        }

        #s6-term-a,
        #s6-term-b {
          top: 197px;
          height: 606px;
        }

        #s6-browser {
          top: 8px;
          height: 986px;
        }

      </style>

      <div id="root" data-composition-id="s6-newcomer" data-width="1920" data-height="1080">
        <div class="window" id="s6-term-a">
          <div class="window-bar">
            <div class="window-lamps"><i></i><i></i><i></i></div>
            <div class="window-name" data-layout-ignore>the newcomer's terminal</div>
            <div class="window-prov" data-layout-ignore>re-enactment of a recorded testnet run · evidence/2026-10-22-bob-knock.txt</div>
          </div>
          <div class="term-body" data-layout-ignore>
            <!-- prettier-ignore-start -->
            <span class="line line-cmd" data-at="0" data-type="1.1" data-cursor="1">$ $U knock --gate http://127.0.0.1:8080 --room holders-room --wallet "$B" \</span>
            <span class="line line-cmd" data-at="1.3" data-type="1.0" data-cursor="1">    --pir http://localhost:3000 --lightwalletd https://testnet.zec.rocks:443 \</span>
            <span class="line line-cmd" data-at="2.4" data-type="0.5" data-cursor="1">    --identity "$ID" --expected-h1-root "$H1"</span>
            <span class="line line-key" data-at="3.0">gate          http://127.0.0.1:8080</span>
            <span class="line line-key" data-at="3.1">room          holders-room</span>
            <span class="line line-key" data-at="3.2">network       test</span>
            <span class="line line-key" data-at="3.3">window        h0 4505790 through h1 4506510</span>
            <span class="line line-key" data-at="3.4">threshold     12500000 zatoshis</span>
            <span class="line line-refuse" data-at="3.75" id="s6-verdict-a">REFUSED  COINS_TOO_NEW</span>
            <span class="line" data-at="4.15">  the account held no unspent Ironwood note at h0</span>
            <span class="line line-key" data-at="4.35">  why:  None of the wallet's eligible coins existed at h0. No proof was made.</span>
            <span class="line line-key" data-at="4.55">  next: Only coins held since h0 qualify for this gate.</span>
            <span class="line" data-at="4.95" id="s6-nothing-sent">nothing was sent to the gate</span>
            <span class="line" data-at="5.45" id="s6-no-record">no challenge was asked for, so this gate has no record of this attempt</span>
            <span class="line" data-at="5.9" data-cursor="1">$ </span>
            <!-- prettier-ignore-end -->
            <span class="cursor-block"></span>
          </div>
        </div>

        <div class="window" id="s6-term-b">
          <div class="window-bar">
            <div class="window-lamps"><i></i><i></i><i></i></div>
            <div class="window-name" data-layout-ignore>the newcomer's terminal — forced, as a demonstration</div>
            <div class="window-prov" data-layout-ignore>re-enactment of a recorded testnet run · evidence/2026-10-22-bob-forced-knock.txt</div>
          </div>
          <div class="term-body" data-layout-ignore>
            <!-- prettier-ignore-start -->
            <span class="line line-cmd" data-at="6.6" data-type="1.1" data-cursor="1">$ $U knock --gate http://127.0.0.1:8080 --room holders-room --wallet "$B" \</span>
            <span class="line line-cmd" data-at="7.8" data-type="0.95" data-cursor="1">    --pir http://localhost:3000 --lightwalletd https://testnet.zec.rocks:443 \</span>
            <span class="line line-cmd" data-at="8.85" data-type="0.8" data-cursor="1">    --identity "$ID" --expected-h1-root "$H1" --force-unqualified-demo</span>
            <span class="line line-demo" data-at="9.8">DEMO: submitting a proof that does not meet this room's rule</span>
            <span class="line line-key" data-at="10.05">  this room refuses these coins: COINS_TOO_NEW  the account held no unspent Ironwood note at h0</span>
            <span class="line line-key" data-at="10.3">  proving instead against the latest note-commitment root these coins appear in, at block 4528029</span>
            <span class="line line-key" data-at="10.55">  your coins: 1 note(s), first mined at block 4526842, unspent through block 4528029 (read from …)</span>
            <span class="line line-key" data-at="10.8">  expect the gate to refuse this with ROOT_MISMATCH: it decides from the roots it pinned, …</span>
            <span class="line line-key" data-at="11.15">challenge     issued by the gate, expires 2026-10-22T06:09:43Z</span>
            <span class="line" data-at="11.4">proving now; 1 note(s) against the note-commitment root at block 4528029; this takes seconds and …</span>
            <span class="line line-cut" data-at="11.95">                                                               — cut —</span>
            <span class="line line-refuse" data-at="12.6" id="s6-verdict-b">REFUSED</span>
            <span class="line line-code" data-at="13.0">  ROOT_MISMATCH</span>
            <span class="line" data-at="13.25">  The proof does not match this gate's window: the coins were not held unmoved from h0 through h1.</span>
            <span class="line line-key" data-at="13.5">  retryable: false</span>
            <!-- prettier-ignore-end -->
            <span class="cursor-block"></span>
          </div>
        </div>

        <div class="browser" id="s6-browser">
          <div class="window-bar">
            <div class="window-lamps"><i></i><i></i><i></i></div>
            <div class="url" data-layout-ignore>127.0.0.1:8080/room/holders-room?replay=act4-newcomer&amp;present=1</div>
            <div class="window-prov" data-layout-ignore>re-enactment of a recorded testnet run · evidence/2026-10-22-bob-forced-knock.txt</div>
          </div>
          <div class="viewport">
            <div class="viewport-world" id="s6-world">
              <iframe class="page-frame" src="assets/site/act4-newcomer.present.html" title="Holders' Room, act 4"></iframe>
            </div>
          </div>
        </div>

      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var CUT_B = 6.6;
          var CUT_PAGE = 14.2;

          var termA = document.getElementById("s6-term-a");
          var termB = document.getElementById("s6-term-b");
          var browser = document.getElementById("s6-browser");

          film.terminal(tl, termA, CUT_B);
          film.terminal(tl, termB, CUT_PAGE);
          /* The camera opens on the whole page, then eases in on the break in the rail. */
          film.camera(tl, document.getElementById("s6-world"), [
            { at: CUT_PAGE + 0.5, dur: 2.2, zoom: 2.18, px: 440, py: 783, ease: "power2.inOut" }
          ]);

          gsap.set([termB, browser], { opacity: 0 });

          /* The two lines this run exists to show: the refusal happened on the holder's side. */
          tl.fromTo(
            [document.getElementById("s6-nothing-sent"), document.getElementById("s6-no-record")],
            { x: -16, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.35 },
            4.95
          );
          tl.fromTo(
            document.getElementById("s6-verdict-a"),
            { scale: 1.1, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
            3.75
          );

          tl.to([termA], { opacity: 0, duration: 0.35, ease: "power2.in" }, CUT_B - 0.4);
          tl.fromTo(termB, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, CUT_B);
          tl.fromTo(
            document.getElementById("s6-verdict-b"),
            { scale: 1.1, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2.2)", transformOrigin: "0% 50%" },
            12.6
          );

          tl.to([termB], { opacity: 0, duration: 0.35, ease: "power2.in" }, CUT_PAGE - 0.35);
          tl.fromTo(
            browser,
            { opacity: 0, scale: 0.985 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
            CUT_PAGE
          );

          window.__timelines["s6-newcomer"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
