[package]
name = "unstirred-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The holder's half of Unstirred: read-only wallet access, note selection, historical witnesses at h0, the private nullifier lookup at h1, and the proof and binding signature that go in a proof package."
readme = "README.md"
include = ["src/**/*", "README.md"]

[features]
# Synthetic test support (the wallet and nullifier set in `testing`): everything a test needs to
# build a proof without a chain. Off by default so a normal build carries no test-only crates;
# the verifier's tests enable it as a dev-dependency.
test-harness = [
    "dep:rand",
    "dep:tempfile",
    "dep:zcash_primitives",
    "zcash_client_sqlite/test-dependencies",
    "zcash_client_backend/test-dependencies",
    "zcash_protocol/local-consensus",
]

[dependencies]
unstirred-core = { path = "../unstirred-core", version = "=0.1.0" }
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
zcash_primitives = { workspace = true, optional = true }
age.workspace = true
bip0039.workspace = true
secrecy.workspace = true
toml.workspace = true
zip32.workspace = true
zcash_client_sqlite.workspace = true
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic"] }
zcash_protocol.workspace = true
voting-circuits.workspace = true
voting-crypto-deps.workspace = true
pir-client.workspace = true
pir-types.workspace = true
serde.workspace = true
serde_json.workspace = true
incrementalmerkletree.workspace = true
rusqlite.workspace = true
hex.workspace = true
tokio.workspace = true
anyhow.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tonic.workspace = true
thiserror.workspace = true

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
zcash_client_sqlite = { workspace = true, features = ["test-dependencies"] }
zcash_client_backend = { workspace = true, features = ["test-dependencies"] }
zcash_primitives.workspace = true
zcash_protocol = { workspace = true, features = ["local-consensus"] }

[lints]
workspace = true
